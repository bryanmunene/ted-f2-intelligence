<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v={{ static_asset_versions.css }}">
  <script defer src="{{ url_for('static', path='js/app.js') }}?v={{ static_asset_versions.js }}"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark">cB</div>
          <div>
            <div class="brand-title">TED F2 Intelligence</div>
            <div class="brand-subtitle">Find, review, and shortlist TED opportunities</div>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="topbar-note">
            <svg class="ui-icon ui-icon-inline" aria-hidden="true"><use href="{{ url_for('static', path='icons/ui-icons.svg') }}?v={{ static_asset_versions.icons }}#icon-radar"></use></svg>
            TED opportunity review workspace
          </div>
          <nav class="nav">
            <a href="/" class="{% if active_path == '/' %}is-active{% endif %}"><svg class="ui-icon nav-icon" aria-hidden="true"><use href="{{ url_for('static', path='icons/ui-icons.svg') }}?v={{ static_asset_versions.icons }}#icon-home"></use></svg>Home</a>
            <a href="/scan" class="{% if active_path == '/scan' %}is-active{% endif %}"><svg class="ui-icon nav-icon" aria-hidden="true"><use href="{{ url_for('static', path='icons/ui-icons.svg') }}?v={{ static_asset_versions.icons }}#icon-search"></use></svg>Start Search</a>
            <a href="/results" class="{% if active_path.startswith('/results') %}is-active{% endif %}"><svg class="ui-icon nav-icon" aria-hidden="true"><use href="{{ url_for('static', path='icons/ui-icons.svg') }}?v={{ static_asset_versions.icons }}#icon-stack"></use></svg>Shortlist</a>
            <a href="/admin" class="{% if active_path == '/admin' %}is-active{% endif %}"><svg class="ui-icon nav-icon" aria-hidden="true"><use href="{{ url_for('static', path='icons/ui-icons.svg') }}?v={{ static_asset_versions.icons }}#icon-settings"></use></svg>Settings</a>
          </nav>
        </div>
      </div>
    </header>

    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
